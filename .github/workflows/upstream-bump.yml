name: Upstream bump

# Weekly (and on dispatch), the same scheme as fmu1337/sourcemod-css34's upstream-bump.yml:
# when the `cssdm` submodule is behind alliedmodders/cssdm master, rebuild bump/cssdm from
# master with the submodule at the upstream tip and open (or update) ONE PR. Its body lists
# the upstream commits, which of them touch files our base patch changes, and gamedata keys
# the new code looks up that the v34 gamedata lacks. A re-run with no new upstream commit
# changes nothing.
#
# Jules (optional, secrets.JULES_API_KEY): every new or rebuilt bump PR gets a read-only
# Jules review as a PR comment. When the base patch no longer applies, Jules gets a
# minimal-fix task and opens its own PR against master. Jules never gets this repository's
# token, nothing merges automatically, and a Jules failure never fails the bump.
#
# Owner setup: the bump GitHub App (contents + pull-requests: write) installed on this
# repository, vars.BUMP_APP_ID and secrets.BUMP_APP_KEY; its token is what makes CI run on
# the bump PR (GITHUB_TOKEN events trigger no workflows). The merge of a bump PR then
# publishes a release (release.yml).
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      behind: ${{ steps.plan.outputs.behind }}
      old: ${{ steps.plan.outputs.old }}
      new: ${{ steps.plan.outputs.new }}
      old_rev: ${{ steps.plan.outputs.old_rev }}
      new_rev: ${{ steps.plan.outputs.new_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Upstream tip vs submodule
        id: plan
        run: |
          set -euo pipefail
          git -C cssdm fetch --quiet --unshallow 2>/dev/null || git -C cssdm fetch --quiet --depth=1000
          python3 builder/scripts/upstream.py plan | tee plan.json
          python3 - <<'PY'
          import json, os
          p = json.load(open("plan.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k in ("old", "new", "old_rev", "new_rev"):
                  fh.write("{}={}\n".format(k, p[k]))
              fh.write("behind={}\n".format("true" if p["behind"] else "false"))
          if p["behind"]:
              print("::notice::cssdm git{old_rev} -> git{new_rev} ({new})".format(**p))
          else:
              print("::notice::cssdm is at upstream master (git{new_rev})".format(**p))
          PY

  bump:
    needs: plan
    if: needs.plan.outputs.behind == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    env:
      BRANCH: bump/cssdm
      OLD: ${{ needs.plan.outputs.old }}
      NEW: ${{ needs.plan.outputs.new }}
      OLD_REV: ${{ needs.plan.outputs.old_rev }}
      REV: ${{ needs.plan.outputs.new_rev }}
    steps:
      - name: Require the bump GitHub App
        env:
          APP_ID: ${{ vars.BUMP_APP_ID }}
          HAS_KEY: ${{ secrets.BUMP_APP_KEY != '' }}
        run: |
          if [[ -z "$APP_ID" || "$HAS_KEY" != true ]]; then
            echo "::error::set vars.BUMP_APP_ID and secrets.BUMP_APP_KEY (a GitHub App with contents + pull-requests: write); a GITHUB_TOKEN PR would get no CI"
            exit 1
          fi

      - name: App token
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          submodules: true

      - name: Skip if bump/cssdm already carries this upstream commit
        id: dedup
        run: |
          set -euo pipefail
          current=""
          if git fetch --quiet origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}" 2>/dev/null; then
            current="$(git ls-tree "origin/${BRANCH}" cssdm | awk '{print $3}')"
          fi
          if [[ "$current" == "$NEW" ]] && git merge-base --is-ancestor origin/master "origin/${BRANCH}"; then
            echo "::notice::${BRANCH} is already at ${NEW} on top of master; nothing to do"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Jules available?
        id: jules
        env:
          HAS_KEY: ${{ secrets.JULES_API_KEY != '' }}
        run: echo "has=${HAS_KEY}" >> "$GITHUB_OUTPUT"

      - name: Move the submodule and check the base patch
        id: apply
        if: steps.dedup.outputs.skip == '0'
        run: |
          set -euo pipefail
          git -C cssdm fetch --quiet --unshallow 2>/dev/null || git -C cssdm fetch --quiet --depth=1000
          git -C cssdm fetch --quiet https://github.com/alliedmodders/cssdm "$NEW"
          python3 builder/scripts/upstream.py apply "$NEW" 2>&1 | tee "$RUNNER_TEMP/apply.log"

      - name: Push bump/cssdm and open or update its PR
        id: pr
        if: steps.dedup.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          python3 builder/scripts/upstream.py body "$OLD" "$NEW" > "$RUNNER_TEMP/body.md"
          printf '\nGenerated by `.github/workflows/upstream-bump.yml`; merging it publishes a release.\n' >> "$RUNNER_TEMP/body.md"
          cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"
          title="Bump cssdm: git${OLD_REV} -> git${REV} (${NEW:0:8})"
          git config user.name "css34-bump[bot]"
          git config user.email "css34-bump[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -q -m "$title" -m "Generated by .github/workflows/upstream-bump.yml."
          # bump/cssdm belongs to this workflow: it is rebuilt from master every run.
          git push --force origin "$BRANCH"
          number="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            echo "::notice::updated PR #${number}"
          else
            gh pr create --base master --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md"
            number="$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # Read-only: Jules starts on bump/cssdm, may not change anything; its report becomes a
      # comment on the PR. Never fails the job.
      - name: Jules review of the bump (read-only)
        if: steps.pr.outcome == 'success' && steps.jules.outputs.has == 'true'
        continue-on-error: true
        timeout-minutes: 50
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          python3 builder/scripts/jules.py prompt review --old "$OLD" --new "$NEW" --rev "$REV" \
            --context "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/jules-review.md"
          session="$(python3 builder/scripts/jules.py start --skip-if-exists \
            --title "cssdm bump review: git${REV} (${NEW:0:12})" \
            --prompt-file "$RUNNER_TEMP/jules-review.md" --branch "$BRANCH")"
          if [[ "$(jq -r .existing <<<"$session")" == true ]]; then
            echo "::notice::Jules already reviewed git${REV}: $(jq -r .url <<<"$session")"
            exit 0
          fi
          gh pr comment "$NUMBER" --body "Jules is reviewing this bump (read-only, no changes): $(jq -r '.url // .name' <<<"$session")"
          python3 builder/scripts/jules.py wait "$(jq -r .name <<<"$session")" --timeout 2700 \
            --out "$RUNNER_TEMP/jules-report.md"
          gh pr comment "$NUMBER" --body-file "$RUNNER_TEMP/jules-report.md"

      # The base patch does not apply to the new upstream: Jules gets a minimal-fix task and
      # opens its OWN PR against master (full CI, merged by a human).
      - name: Ask Jules for a minimal fix (own PR)
        if: failure() && steps.apply.outcome == 'failure' && steps.jules.outputs.has == 'true'
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -euo pipefail
          python3 builder/scripts/jules.py prompt fix --old "$OLD" --new "$NEW" --rev "$REV" \
            --context "$RUNNER_TEMP/apply.log" > "$RUNNER_TEMP/jules-fix.md"
          session="$(python3 builder/scripts/jules.py start --skip-if-exists --auto-pr \
            --title "cssdm bump fix: git${REV} (${NEW:0:12})" \
            --prompt-file "$RUNNER_TEMP/jules-fix.md" --branch master)"
          url="$(jq -r '.url // .name' <<<"$session")"
          echo "::warning::bump to git${REV} does not apply; Jules is preparing a fix PR: ${url}"
          echo "Bump to git${REV} failed; Jules fix session: ${url}" >> "$GITHUB_STEP_SUMMARY"
