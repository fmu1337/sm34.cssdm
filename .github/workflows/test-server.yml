name: Test Server

on:
  push:
    branches:
      - master
      - 'cursor/**'
  pull_request:
  workflow_dispatch:
    inputs:
      record_secs:
        description: "Botplay recording length in seconds"
        required: false
        default: "180"

concurrency:
  group: test-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build-linux (${{ matrix.line }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        line: [sm11, sm12, sm13]
    env:
      CSSDM_SM_LINE: ${{ matrix.line }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Deepen cssdm submodule history
        run: |
          git -C cssdm fetch --unshallow 2>/dev/null || git -C cssdm fetch --depth=500 || true
          echo "cssdm rev-list=$(git -C cssdm rev-list --count HEAD)"

      - name: Install build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            binutils curl g++-multilib gcc-multilib git \
            lib32stdc++6 lib32z1-dev libc6-dev-i386 \
            libstdc++-12-dev:i386 linux-libc-dev \
            python3 python3-pip python3-venv zlib1g-dev:i386

      - name: Set up Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip setuptools wheel
          .venv/bin/pip install requests uritemplate discord-webhook
          git clone --depth 1 https://github.com/alliedmodders/ambuild /tmp/ambuild
          .venv/bin/pip install /tmp/ambuild

      - name: Checkout build dependencies
        run: DEPS_DIR="$HOME" bash builder/run/checkout-deps.sh

      - name: Build CSS:DM
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
          CC: gcc
          CXX: g++
        run: |
          chmod +x builder/run/linux.sh testing/scripts/*.sh
          export PATH="${VIRTUAL_ENV}/bin:${PATH}"
          export DEPS_DIR="${HOME}"
          builder/run/linux.sh
          mkdir -p packages
          cp -f OUT/package/cssdm-*-css34-*linux.tar.gz packages/

      - name: Upload CSS:DM package
        uses: actions/upload-artifact@v4
        with:
          name: cssdm-css34-linux-for-test-${{ matrix.line }}
          path: packages/cssdm-*-css34-*linux.tar.gz
          if-no-files-found: error

  check-package:
    name: check-package (${{ matrix.line }})
    needs: [build-linux]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        line: [sm11, sm12, sm13]
    env:
      CSSDM_SM_LINE: ${{ matrix.line }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSS:DM package
        uses: actions/download-artifact@v4
        with:
          name: cssdm-css34-linux-for-test-${{ matrix.line }}
          path: packages

      - name: ABI / package checks
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils
          chmod +x testing/scripts/*.sh
          CSSDM_PACKAGE="$(ls packages/cssdm-*-css34-*linux.tar.gz | head -n1)"
          export CSSDM_PACKAGE
          testing/scripts/check-cssdm-package.sh

  test-cssdm-botplay:
    name: test-cssdm-botplay (${{ matrix.line }})
    needs: [build-linux, check-package]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        line: [sm11, sm12, sm13]
    env:
      CSSDM_SM_LINE: ${{ matrix.line }}
      # sm12/sm13 test the packages that line-sm12-latest / line-sm13-latest point at
      # (builder/run/css34_line.py).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSS:DM package
        uses: actions/download-artifact@v4
        with:
          name: cssdm-css34-linux-for-test-${{ matrix.line }}
          path: packages

      # The pointer's git tag is not moved with the release, so the harness comes from the
      # release tag named in line-sm13-latest's lines.json. It also drives sm11 and sm12.
      - name: Resolve harness tag
        id: harness
        run: |
          eval "$(python3 builder/run/css34_line.py sm13 .ci-css34-harness)"
          echo "ref=${CSS34_TAG}" >>"$GITHUB_OUTPUT"

      - name: Checkout sourcemod-css34 testing harness
        uses: actions/checkout@v4
        with:
          repository: fmu1337/sourcemod-css34
          ref: ${{ steps.harness.outputs.ref }}
          path: .ci-vendor/sourcemod-css34

      - name: Install host 32-bit runtime + tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            curl expect git unzip unrar \
            lib32gcc-s1 lib32stdc++6 lib32z1 libc6-i386 \
            libstdc++6:i386 zlib1g:i386

      - name: CSS:DM smoke (+ botplay on sm12/sm13) (${{ matrix.line }})
        env:
          SERVER_DIR: ${{ github.workspace }}/.ci-server
          CACHE_DIR: ${{ github.workspace }}/.ci-cache
          SM_CSS34_ROOT: ${{ github.workspace }}/.ci-vendor/sourcemod-css34
          RECORD_SECS: ${{ github.event.inputs.record_secs || '180' }}
          # The harness botplay compiles SM >= 1.12 probe plugins (dhooks include,
          # GeoipLatitude), which SM 1.11's spcomp cannot build: smoke only on sm11.
          RUN_BOTPLAY: ${{ matrix.line != 'sm11' && '1' || '0' }}
          APPLY_SRCDS_PATCH: "1"
          APPLY_VALVE_RC: "1"
          INSTALL_SMAC: "0"
          MIN_SMAC_RUNNING: "0"
          MIN_ROUND_START: "1"
          MIN_ROUND_END: "1"
          MIN_PLAYER_DEATH: "3"
          # With DM on, bots respawn already equipped by dm_equipment and rarely buy, so the
          # harness's cstrike buy/price detour counters are luck (0..8 per 180 s on SM 1.12 and
          # 1.13 alike; 120-210 with cssdm_enabled 0). Those detours are covered by the fork's CI.
          MIN_CS_BUY: "0"
          MIN_CS_PRICE: "0"
        run: |
          chmod +x testing/scripts/*.sh .ci-vendor/sourcemod-css34/testing/scripts/*.sh
          CSSDM_PACKAGE="$(ls packages/cssdm-*-css34-*linux.tar.gz | head -n1)"
          export CSSDM_PACKAGE
          testing/scripts/cssdm-bot-test.sh

      - name: Upload botplay / smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cssdm-botplay-logs-${{ matrix.line }}
          path: |
            .ci-server/cssdm-smoke.log
            .ci-server/console-probe.log
            .ci-server/botplay-run.log
            .ci-server/botplay.log
            .ci-server/cssdm-botplay-report.json
            .ci-server/cssdm-botplay-report.txt
            .ci-server/cstrike/console.log
            .ci-server/cstrike/addons/sourcemod/logs/L*.log
          if-no-files-found: ignore
          retention-days: 7
